<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Ashframe: a darkroom in your browser. A black cat on three old books beside a folding camera, in the rain.">
  <title>Ashframe: a darkroom in your browser</title>
  <style>
    .word { font-family: 'Cormorant Garamond', 'Iowan Old Style', Georgia, 'Times New Roman', serif; fill: #ede4d0; }
    .sans { font-family: 'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif; fill: #a99a82; }
    .rain line { stroke: #ede4d0; stroke-width: 1; animation: fall 1.5s linear infinite; }
    .art { fill: none; stroke: #ede4d0; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
    .desk { stroke: #5b4d40; }
    .cover { fill: #201a15; }
    .solid { fill: #0b0908; }
    .body { stroke-width: 1.5; }
    .hair { stroke-width: 0.8; opacity: 0.55; }
    .band { stroke: #b8935a; stroke-width: 1.6; }
    .label { stroke: #b8935a; stroke-width: 0.8; }
    .nose { fill: #c98a80; stroke: none; }
    .inner-ear { fill: #4f6380; stroke: none; opacity: 0.8; }
    .eye { fill: #ede4d0; stroke: none; }
    .pupil { fill: #0b0908; stroke: none; }
    .shine { fill: #ede4d0; stroke: none; }
    .tail-rim { stroke: #ede4d0; stroke-width: 12.5; }
    .tail-core { stroke: #0b0908; stroke-width: 9.5; }
    .glass { fill: #0b0908; stroke-width: 0.8; }
    .glint { fill: #ede4d0; stroke: none; opacity: 0.7; }
    .bulb { fill: #ede4d0; stroke: none; }
    .stem { stroke-width: 2; }
    .eyes { transform-box: fill-box; transform-origin: center; animation: blink 7s infinite; }
    .tail { transform-box: fill-box; transform-origin: 0% 100%; animation: swish 5s ease-in-out infinite alternate; }
    .pupils { animation: glance 11s ease-in-out infinite; }
    .flash { opacity: 0; fill: #b8935a; fill-opacity: 0.25; stroke: #b8935a; stroke-width: 1.4; transform-box: fill-box; transform-origin: center; animation: flash 6s ease-out 1.2s infinite; }
    @keyframes fall { from { transform: translate(0, 0); } to { transform: translate(-130px, 480px); } }
    @keyframes blink { 0%, 97%, 100% { transform: scaleY(1); } 98.5% { transform: scaleY(0.1); } }
    @keyframes glance { 0%, 40%, 82%, 100% { transform: translateX(0); } 46%, 56% { transform: translateX(-3.5px); } 62%, 76% { transform: translateX(3.5px); } }
    @keyframes swish { from { transform: rotate(-8deg); } to { transform: rotate(8deg); } }
    @keyframes flash { 0% { opacity: 0; transform: scale(0.4); } 2.5% { opacity: 1; transform: scale(1); } 15%, 100% { opacity: 0; transform: scale(1.35); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none; } }
  </style>
